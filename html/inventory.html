<!DOCTYPE html>
<html lang="en" data-currency="USD">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All inventory — Veloce</title>
  <meta name="description" content="Electric, SUV, sedan, performance and truck models — filter by body type, fuel and price.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('motion-ready');</script>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/motion.css">
  <link rel="stylesheet" href="assets/sections.css">
  <link rel="stylesheet" href="assets/car-sections.css">
  <link rel="stylesheet" href="assets/pages.css">
</head>
<body class="sx">
  <div data-site-header></div>
  <script src="assets/brand.js"></script>
  <script src="assets/site.js"></script>

  <main id="main" data-page="inventory">

    <section class="page-hero">
      <div class="container">
        <ol class="crumbs" data-reveal><li><a href="index.html">Home</a></li><li aria-current="page">Inventory</li></ol>
        <h1 class="h1" data-shop-title data-reveal>All <em>inventory</em></h1>
        <p class="lead" data-reveal style="--rd:.1s">Every model in the showroom. Hover a paint dot to repaint the car — the price follows.</p>
      </div>
    </section>

    <div class="shop-bar" data-shop-bar>
      <div class="container shop-bar-in">
        <div class="tabs" role="group" aria-label="Body type" data-shop-tabs></div>
        <div class="shop-tools">
          <div class="shop-filters">
            <label class="price-filter"><span data-shop-max-out>Any price</span><input type="range" step="5000" data-shop-max aria-label="Maximum price"></label>
            <label class="visually-hidden" for="shop-fuel">Fuel</label>
            <div class="select-mini"><select id="shop-fuel" data-shop-fuel></select></div>
          </div>
          <label class="visually-hidden" for="shop-sort">Sort by</label>
          <div class="select-mini">
            <select id="shop-sort" data-shop-sort>
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="power">Most powerful</option>
              <option value="accel">Quickest 0–100</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
          <span class="shop-count" data-shop-count></span>
          <div class="view-toggle" role="group" aria-label="Grid size">
            <button type="button" data-cols="3" aria-pressed="true" aria-label="3 columns"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="4" width="5.5" height="16" rx="1"/><rect x="9.25" y="4" width="5.5" height="16" rx="1"/><rect x="16.5" y="4" width="5.5" height="16" rx="1"/></svg></button>
            <button type="button" data-cols="2" aria-pressed="false" aria-label="2 columns"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="4" width="9" height="16" rx="1"/><rect x="13" y="4" width="9" height="16" rx="1"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <section class="container shop-main">
      <p class="shop-query" data-shop-query hidden><span></span><button type="button">Clear search</button></p>
      <div class="cc-grid" data-shop-grid></div>
      <div class="shop-empty" data-shop-empty hidden>
        <h2>No cars match</h2>
        <p>Try another body type, raise the price limit or clear the search.</p>
        <button type="button" class="btn btn-dark" data-shop-reset>Show everything</button>
      </div>
    </section>

  </main>

  <div data-site-footer></div>

  <script src="assets/car-art.js"></script>
  <script src="assets/site-cart.js"></script>
  <script src="assets/data/catalog.js"></script>
  <script src="assets/motion.js"></script>
  <script src="assets/car-card.js"></script>
  <script src="assets/car-sections.js"></script>
  <script src="assets/sections.js"></script>
  <script src="assets/pages.js"></script>
</body>
</html>
